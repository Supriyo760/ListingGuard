<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ListingGuard — Autonomous Token Listing Desk</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f2937;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      padding: 1.5rem 1rem;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .brand h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
    .brand p { font-size: 0.875rem; color: var(--text-muted); }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.625rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-testnet { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .badge-list { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    .badge-review { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
    .badge-reject { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .card h2 { font-size: 1.125rem; margin-bottom: 1rem; color: #fff; }

    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.8125rem; font-weight: 500; margin-bottom: 0.375rem; color: #d1d5db; }
    input, select {
      width: 100%;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 0.375rem;
      padding: 0.5rem 0.75rem;
      color: #fff;
      font-size: 0.875rem;
    }
    input:focus, select:focus { outline: 2px solid var(--primary); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .toggle-row input { width: auto; }

    button.btn-primary {
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      border: none;
      border-radius: 0.375rem;
      padding: 0.75rem 1.5rem;
      cursor: pointer;
      font-size: 0.9375rem;
      width: 100%;
      transition: background 0.15s;
    }
    button.btn-primary:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .status-panel { display: none; }
    .status-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .spend-counter { font-family: var(--font-mono); font-size: 1.125rem; color: var(--success); font-weight: 700; }

    .checks-list { display: flex; flex-direction: column; gap: 0.625rem; margin-top: 1rem; }
    .check-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a2234;
      border: 1px solid #28354d;
      border-radius: 0.375rem;
      padding: 0.625rem 0.875rem;
      font-size: 0.8125rem;
    }
    .check-name { font-weight: 600; font-family: var(--font-mono); }
    .check-meta { display: flex; align-items: center; gap: 0.75rem; color: var(--text-muted); }

    .verdict-box {
      text-align: center;
      padding: 2rem 1rem;
      border-radius: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .verdict-title { font-size: 2rem; font-weight: 800; letter-spacing: 0.05em; }

    .reasons-list { margin-top: 1rem; list-style: none; }
    .reasons-list li {
      padding: 0.5rem 0.75rem;
      border-radius: 0.375rem;
      margin-bottom: 0.5rem;
      font-size: 0.8125rem;
      background: #1e293b;
      display: flex;
      gap: 0.5rem;
    }

    .cost-line {
      font-family: var(--font-mono);
      background: #0f172a;
      border: 1px dashed #334155;
      padding: 0.875rem 1rem;
      border-radius: 0.375rem;
      text-align: center;
      font-weight: 700;
      color: #38bdf8;
      margin-top: 1.5rem;
      font-size: 0.9375rem;
    }

    .signature-card {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: #94a3b8;
      word-break: break-all;
      background: #0a0f1d;
      padding: 1rem;
      border-radius: 0.375rem;
      border: 1px solid #1e293b;
      margin-top: 1rem;
    }

    .btn-verify {
      background: transparent;
      border: 1px solid #3b82f6;
      color: #60a5fa;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      cursor: pointer;
      font-size: 0.8125rem;
      font-weight: 600;
      margin-top: 0.75rem;
    }
    .btn-verify:hover { background: rgba(59, 130, 246, 0.1); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>ListingGuard</h1>
        <p>Autonomous Token-Listing Intelligence & Risk Desk</p>
      </div>
      <div>
        <span class="badge badge-testnet">Telegraph Escrow (Sepolia)</span>
      </div>
    </header>

    <!-- Application Form -->
    <div class="card" id="formCard">
      <h2>New Token Listing Diligence</h2>
      <form id="deskForm">
        <div class="grid-2">
          <div class="form-group">
            <label for="tokenAddress">Token Contract Address *</label>
            <input type="text" id="tokenAddress" placeholder="0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48" required />
          </div>
          <div class="form-group">
            <label for="chain">Network Chain *</label>
            <select id="chain">
              <option value="ethereum" selected>Ethereum Mainnet</option>
              <option value="polygon">Polygon</option>
              <option value="arbitrum">Arbitrum</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="tokenSymbol">Token Symbol</label>
            <input type="text" id="tokenSymbol" placeholder="e.g. USDC" />
          </div>
          <div class="form-group">
            <label for="socialHandle">Project Social Handle</label>
            <input type="text" id="socialHandle" placeholder="e.g. circle" />
          </div>
        </div>

        <div class="form-group">
          <label for="repoUrl">GitHub Code Repository</label>
          <input type="url" id="repoUrl" placeholder="https://github.com/..." />
        </div>

        <div class="form-group">
          <label for="disclosedWallets">Disclosed Insider/Treasury Wallets (Label:Address, comma-separated)</label>
          <input type="text" id="disclosedWallets" placeholder="Treasury:0x123..., Deployer:0x456..." />
        </div>

        <div class="form-group">
          <label for="teamNames">Core Team / Signers (Comma-separated)</label>
          <input type="text" id="teamNames" placeholder="Alice Smith, Bob Jones" />
        </div>

        <div class="grid-2" style="margin-top: 1rem;">
          <div class="form-group">
            <label for="budgetUsd">Memo Budget Cap ($ USD): <span id="budgetDisplay">1.00</span></label>
            <input type="range" id="budgetUsd" min="0.10" max="5.00" step="0.10" value="1.00" />
          </div>
          <div class="form-group">
            <label>Reliability Cross-Check</label>
            <div class="toggle-row">
              <input type="checkbox" id="crosscheck" />
              <label for="crosscheck" style="margin-bottom:0;">Require dual-miner consensus for security & sanctions</label>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">Launch Autonomous Diligence Desk</button>
      </form>
    </div>

    <!-- Live Status / Result Panel -->
    <div class="card status-panel" id="statusCard">
      <div class="status-header">
        <h2>Live Intelligence Execution</h2>
        <div class="spend-counter">Spend: $<span id="spendTicker">0.0000</span></div>
      </div>

      <div id="verdictBanner" style="display:none;" class="verdict-box">
        <div class="verdict-title" id="verdictText">VERDICT</div>
      </div>

      <div class="checks-list" id="checksList"></div>

      <div id="findingsSection" style="display:none; margin-top:1.5rem;">
        <h3 style="font-size:1rem; margin-bottom:0.5rem;">Risk Assessment & Reasons:</h3>
        <ul class="reasons-list" id="reasonsList"></ul>
      </div>

      <div id="costLineDisplay" style="display:none;" class="cost-line"></div>

      <div id="proofSection" style="display:none;" class="signature-card">
        <div><strong>Cryptographic Attestation & Audit Trail:</strong></div>
        <div style="margin-top:0.25rem;">Signer: <span id="memoSigner"></span></div>
        <div>Content Hash: <span id="memoContentHash"></span></div>
        <div>Signature: <span id="memoSig"></span></div>
        <button class="btn-verify" id="verifyBtn" onclick="verifyActiveMemo()">Verify Memo Authenticity On-Chain</button>
        <span id="verifyResult" style="margin-left: 0.5rem; font-weight:600;"></span>
      </div>
    </div>
  </div>

  <script>
    let activeMemo = null;
    const budgetSlider = document.getElementById("budgetUsd");
    const budgetDisplay = document.getElementById("budgetDisplay");
    budgetSlider.addEventListener("input", (e) => {
      budgetDisplay.textContent = parseFloat(e.target.value).toFixed(2);
    });

    const form = document.getElementById("deskForm");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.textContent = "Querying Telegraph Miners...";

      const walletsRaw = document.getElementById("disclosedWallets").value.trim();
      const disclosedWallets = [];
      if (walletsRaw) {
        walletsRaw.split(",").forEach(item => {
          const [label, address] = item.split(":");
          if (label && address) disclosedWallets.push({ label: label.trim(), address: address.trim() });
        });
      }

      const teamNamesRaw = document.getElementById("teamNames").value.trim();
      const teamNames = teamNamesRaw ? teamNamesRaw.split(",").map(s => s.trim()).filter(Boolean) : [];

      const payload = {
        application: {
          chain: document.getElementById("chain").value,
          tokenAddress: document.getElementById("tokenAddress").value.trim(),
          tokenSymbol: document.getElementById("tokenSymbol").value.trim() || undefined,
          socialHandle: document.getElementById("socialHandle").value.trim() || undefined,
          repoUrl: document.getElementById("repoUrl").value.trim() || undefined,
          disclosedWallets,
          teamNames
        },
        options: {
          budgetUsd: parseFloat(budgetSlider.value),
          crosscheck: document.getElementById("crosscheck").checked
        }
      };

      document.getElementById("statusCard").style.display = "block";
      document.getElementById("checksList").innerHTML = "";
      document.getElementById("verdictBanner").style.display = "none";
      document.getElementById("findingsSection").style.display = "none";
      document.getElementById("costLineDisplay").style.display = "none";
      document.getElementById("proofSection").style.display = "none";

      try {
        const res = await fetch("/api/memo", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.id) {
          startEventStream(data.id);
        } else {
          alert("Error: " + (data.error || "Failed to start desk"));
          submitBtn.disabled = false;
        }
      } catch (err) {
        alert("Request error: " + err.message);
        submitBtn.disabled = false;
      }
    });

    function startEventStream(memoId) {
      const evtSource = new EventSource(`/api/memo/${memoId}/events`);
      const checksMap = new Map();

      evtSource.addEventListener("check_started", (e) => {
        const d = JSON.parse(e.data);
        updateCheckRow(d.checkId, d.intent, "running", 0);
        document.getElementById("spendTicker").textContent = d.totalSpentUsd.toFixed(4);
      });

      evtSource.addEventListener("check_done", (e) => {
        const d = JSON.parse(e.data);
        updateCheckRow(d.checkId, d.intent, "done", d.costUsd);
        document.getElementById("spendTicker").textContent = d.totalSpentUsd.toFixed(4);
      });

      evtSource.addEventListener("check_failed", (e) => {
        const d = JSON.parse(e.data);
        updateCheckRow(d.checkId, d.intent, "failed", 0);
      });

      evtSource.addEventListener("desk_completed", (e) => {
        const d = JSON.parse(e.data);
        evtSource.close();
        document.getElementById("submitBtn").disabled = false;
        document.getElementById("submitBtn").textContent = "Desk Execution Finished";
        renderCompletedMemo(d.data || d);
      });
    }

    function updateCheckRow(checkId, intent, status, cost) {
      const list = document.getElementById("checksList");
      let row = document.getElementById("row_" + checkId);
      if (!row) {
        row = document.createElement("div");
        row.id = "row_" + checkId;
        row.className = "check-item";
        list.appendChild(row);
      }

      let statusBadge = `<span class="badge" style="background:#374151; color:#9ca3af;">Pending</span>`;
      if (status === "running") {
        statusBadge = `<span class="badge" style="background:rgba(59,130,246,0.2); color:#60a5fa;">Querying Miner</span>`;
      } else if (status === "done") {
        statusBadge = `<span class="badge" style="background:rgba(16,185,129,0.2); color:#34d399;">Verified</span>`;
      } else if (status === "failed") {
        statusBadge = `<span class="badge" style="background:rgba(239,68,68,0.2); color:#f87171;">Failed</span>`;
      }

      row.innerHTML = `
        <span class="check-name">${checkId}</span>
        <div class="check-meta">
          <span>${intent || ""}</span>
          ${statusBadge}
          <span>$${(cost || 0).toFixed(4)}</span>
        </div>
      `;
    }

    function renderCompletedMemo(memo) {
      activeMemo = memo;
      const banner = document.getElementById("verdictBanner");
      const title = document.getElementById("verdictText");
      banner.style.display = "block";

      if (memo.verdict === "LIST") {
        banner.className = "verdict-box badge-list";
        title.textContent = "VERDICT: LIST (APPROVED)";
      } else if (memo.verdict === "REVIEW") {
        banner.className = "verdict-box badge-review";
        title.textContent = "VERDICT: REVIEW (ELEVATED RISK)";
      } else {
        banner.className = "verdict-box badge-reject";
        title.textContent = "VERDICT: REJECT (HIGH RISK)";
      }

      const findings = document.getElementById("findingsSection");
      const reasonsList = document.getElementById("reasonsList");
      reasonsList.innerHTML = "";
      if (memo.reasons && memo.reasons.length > 0) {
        findings.style.display = "block";
        memo.reasons.forEach(r => {
          const li = document.createElement("li");
          const tagColor = r.level === "REJECT" ? "var(--danger)" : r.level === "REVIEW" ? "var(--warning)" : "var(--primary)";
          li.innerHTML = `<strong style="color:${tagColor};">[${r.level}]</strong> <span>${r.rule}: ${r.detail}</span>`;
          reasonsList.appendChild(li);
        });
      }

      const costLine = document.getElementById("costLineDisplay");
      costLine.style.display = "block";
      const totalCalls = memo.checks ? memo.checks.reduce((acc, c) => acc + (c.spend ? c.spend.length : 1), 0) : 0;
      costLine.textContent = `COST LINE: Total spend $${memo.cost.spentUsd.toFixed(4)} across ${totalCalls} paid calls`;

      const proof = document.getElementById("proofSection");
      proof.style.display = "block";
      document.getElementById("memoSigner").textContent = memo.signer;
      document.getElementById("memoContentHash").textContent = memo.contentHash;
      document.getElementById("memoSig").textContent = memo.signature;
    }

    async function verifyActiveMemo() {
      if (!activeMemo) return;
      const resElem = document.getElementById("verifyResult");
      resElem.textContent = "Auditing signature...";
      try {
        const res = await fetch("/api/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(activeMemo)
        });
        const audit = await res.json();
        if (audit.valid) {
          resElem.style.color = "var(--success)";
          resElem.textContent = "✓ AUTHENTIC & UNTAMPERED";
        } else {
          resElem.style.color = "var(--danger)";
          resElem.textContent = "✗ TAMPER DETECTED / INVALID SIGNATURE";
        }
      } catch (err) {
        resElem.style.color = "var(--danger)";
        resElem.textContent = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
